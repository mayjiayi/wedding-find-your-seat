<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Find your table at Junyu & May's wedding." />
  <!-- keep the guest list out of search engines (URL still works for anyone with it) -->
  <meta name="robots" content="noindex" />
  <meta property="og:title" content="Junyu & May · Find Your Seat" />
  <meta property="og:description" content="Find your table at Junyu & May's wedding — 26 September 2026, The Secret Haven." />
  <meta property="og:image" content="https://wedding-find-your-seat.vercel.app/og-image.jpg" />
  <meta property="og:url" content="https://wedding-find-your-seat.vercel.app/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Junyu &amp; May &middot; Find Your Seat</title>
  <!-- Chair favicon (inline SVG, no image file needed) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M7,12h9a1,1,0,0,1,1,1v3a0,0,0,0,1,0,0H7a0,0,0,0,1,0,0V12A0,0,0,0,1,7,12Z' fill='%23c9a27a'/%3E%3Cpath d='M7,3V21m10-5v5m0-8a1,1,0,0,0-1-1H7v4H17Z' fill='none' stroke='%23875f3f' stroke-linecap='round' stroke-linejoin='round' stroke-width='2'/%3E%3C/svg%3E" />
  <!-- Elegant serif for the couple's names / headings -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Set the theme before first paint so there's no flash of the wrong mode. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Toggle dark mode">
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
    </svg>
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2"></circle>
      <line x1="12" y1="2.5" x2="12" y2="5"></line>
      <line x1="12" y1="19" x2="12" y2="21.5"></line>
      <line x1="2.5" y1="12" x2="5" y2="12"></line>
      <line x1="19" y1="12" x2="21.5" y2="12"></line>
      <line x1="4.9" y1="4.9" x2="6.7" y2="6.7"></line>
      <line x1="17.3" y1="17.3" x2="19.1" y2="19.1"></line>
      <line x1="4.9" y1="19.1" x2="6.7" y2="17.3"></line>
      <line x1="17.3" y1="6.7" x2="19.1" y2="4.9"></line>
    </svg>
  </button>
  <div class="wrap">
    <header class="hero">
      <h1 class="names">Junyu &amp; May</h1>
      <div class="date">26 September 2026</div>
      <div class="venue">The Secret Haven</div>
      <div class="ornament"><span></span>&#10022;<span></span></div>
      <p class="welcome">You made it! Let's find your seat.</p>
    </header>

    <div class="search">
      <input
        id="searchInput"
        type="text"
        placeholder="Start typing your name…"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="words"
        spellcheck="false"
        aria-label="Search for your name"
      />
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
      </svg>
      <ul id="suggestions" class="suggestions"></ul>
    </div>

    <div class="landing-fact">
      <div class="note-label">Did you know?</div>
      <p class="fact" id="fact" aria-live="off"></p>
      <div class="fact-progress" aria-hidden="true"><i id="factBar"></i></div>
    </div>

    <section id="result" class="result" aria-live="polite"></section>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
